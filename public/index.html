<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCC 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1419;
    --bg-soft: #161c24;
    --bg-card: #1c232c;
    --border: #2a3340;
    --border-soft: #232b36;
    --text: #e6edf3;
    --text-soft: #8b98a5;
    --text-dim: #5c6773;
    --primary: #5eead4;
    --primary-soft: rgba(94, 234, 212, 0.12);
    --accent: #fbbf24;
    --danger: #f87171;
    --success: #4ade80;
    --info: #60a5fa;
    --purple: #c084fc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; font-size: 14px; line-height: 1.5;
    background-image:
      radial-gradient(at 0% 0%, rgba(94, 234, 212, 0.05) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(251, 191, 36, 0.04) 0px, transparent 50%);
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    background: rgba(15, 20, 25, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-soft);
    position: sticky; top: 0; z-index: 100;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary) 0%, #2dd4bf 100%);
    display: grid; place-items: center;
    color: #0f1419; font-weight: 700; font-size: 14px;
  }
  .brand-text h1 { font-size: 14px; font-weight: 600; }
  .brand-text p { font-size: 10.5px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .topbar-status { display: flex; gap: 8px; align-items: center; }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 999px;
    font-size: 11.5px; font-family: 'JetBrains Mono', monospace;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
  .status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-dot.offline { background: var(--danger); }
  .status-dot.connecting { background: var(--accent); animation: pulse 1.4s infinite; }
  .status-dot.waiting { background: var(--purple); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .app {
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    gap: 14px;
    padding: 14px 18px;
    max-width: 1800px;
    margin: 0 auto;
  }
  @media (max-width: 1200px) { .app { grid-template-columns: 260px 1fr; } .col-right { display: none; } }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; } .col-left { display: none; } }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border-soft);
  }
  .card-head h3 {
    font-size: 11.5px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 6px;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .card-head .accent-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }
  .card-body { padding: 12px; }

  .acc-list { display: flex; flex-direction: column; gap: 5px; }
  .acc-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; background: var(--bg-soft);
    border: 1px solid var(--border-soft); border-radius: 9px;
    cursor: pointer; transition: all 0.15s;
  }
  .acc-item:hover { border-color: var(--border); }
  .acc-item.active { border-color: var(--primary); background: var(--primary-soft); }
  .acc-status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .acc-status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .acc-status-dot.connecting { background: var(--accent); animation: pulse 1.4s infinite; }
  .acc-status-dot.offline { background: var(--text-dim); }
  .acc-status-dot.error { background: var(--danger); }
  .acc-status-dot.waiting { background: var(--purple); animation: pulse 1.4s infinite; }
  .acc-info { flex: 1; min-width: 0; }
  .acc-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acc-meta { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-top: 1px; }

  .action-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; padding: 11px 8px;
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 9px; color: var(--text);
    cursor: pointer; transition: all 0.15s ease;
    font-family: inherit; font-size: 11px; text-align: center;
  }
  .action-btn:hover:not(:disabled) { background: var(--primary-soft); border-color: var(--primary); transform: translateY(-1px); }
  .action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .action-btn svg { width: 18px; height: 18px; color: var(--primary); }
  .action-btn .lbl { font-weight: 500; }
  .action-btn .hint { font-size: 9px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .action-btn.cmd-internal svg { color: var(--info); }
  .action-btn.cmd-server svg { color: var(--primary); }
  .action-btn.cmd-chat svg { color: var(--accent); }
  .action-btn.cmd-tp svg { color: var(--success); }
  .action-btn.cmd-danger svg { color: var(--danger); }
  .action-btn.cmd-danger { background: rgba(248, 113, 113, 0.05); }
  .actions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 7px; }

  .command-row { display: flex; gap: 6px; margin-top: 10px; }
  .input {
    flex: 1; padding: 8px 12px; background: var(--bg-soft);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px; outline: none;
  }
  .input:focus { border-color: var(--primary); }
  .input::placeholder { color: var(--text-dim); }
  .btn-primary {
    padding: 8px 14px; background: var(--primary); color: #0f1419;
    border: none; border-radius: 8px; font-weight: 600;
    cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .btn-primary:hover:not(:disabled) { background: #7df0d8; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary {
    padding: 8px 12px; background: var(--bg-soft); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-weight: 500; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .btn-ghost {
    padding: 5px 9px; background: transparent; color: var(--text-soft);
    border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; font-family: inherit; font-size: 10.5px;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--primary); }

  .console {
    background: #0a0e13; border-radius: 0 0 12px 12px;
    padding: 12px; height: 460px; overflow-y: auto;
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.55;
  }
  .console::-webkit-scrollbar { width: 7px; }
  .console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .log-line { display: flex; gap: 8px; padding: 1px 0; word-break: break-word; }
  .log-time { color: var(--text-dim); flex-shrink: 0; font-size: 10.5px; }
  .log-tag { flex-shrink: 0; font-weight: 600; width: 50px; font-size: 10px; }
  .log-tag.info { color: var(--info); }
  .log-tag.warn { color: var(--accent); }
  .log-tag.error { color: var(--danger); }
  .log-tag.chat { color: var(--primary); }
  .log-tag.cmd { color: var(--purple); }
  .log-tag.tp { color: var(--success); }
  .log-tag.system { color: var(--text-soft); }
  .log-msg { color: var(--text); flex: 1; }
  .log-msg .player { color: var(--accent); font-weight: 500; }
  .log-msg .mention { color: var(--primary); font-weight: 600; }

  .wl-list {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 6px; min-height: 50px;
    background: var(--bg-soft);
    border: 1px solid var(--border-soft);
    border-radius: 8px; margin-bottom: 6px;
  }
  .wl-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 6px 3px 8px;
    background: var(--primary-soft);
    border: 1px solid var(--primary);
    border-radius: 999px;
    font-size: 11px; font-family: 'JetBrains Mono', monospace;
  }
  .wl-chip .x {
    width: 14px; height: 14px;
    background: transparent; border: none;
    color: var(--primary); cursor: pointer; border-radius: 50%;
    font-size: 12px; line-height: 1;
  }
  .wl-chip .x:hover { background: var(--primary); color: #0f1419; }
  .wl-empty { color: var(--text-dim); font-size: 10.5px; padding: 4px; }

  .toast-container { position: fixed; top: 60px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
  .toast {
    background: var(--bg-card); border: 1px solid var(--border);
    border-left: 3px solid var(--primary); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; color: var(--text);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4); min-width: 220px;
    animation: slide-in 0.2s ease;
  }
  .toast.error { border-left-color: var(--danger); }
  .toast.warn { border-left-color: var(--accent); }
  @keyframes slide-in { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* ===== LOGIN METHOD PICKER (new) ===== */
  .method-picker {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: grid; place-items: center;
    animation: fade-in 0.2s;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .method-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; max-width: 480px; width: 92%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .method-card h2 { font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .method-card .sub { color: var(--text-soft); font-size: 12px; margin-bottom: 18px; }
  .method-buttons { display: flex; flex-direction: column; gap: 10px; }
  .method-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    text-align: left;
    width: 100%;
  }
  .method-btn:hover { border-color: var(--primary); background: var(--primary-soft); transform: translateY(-1px); }
  .method-btn .ico {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 18px; flex-shrink: 0;
  }
  .method-btn.offline .ico { background: rgba(251, 191, 36, 0.15); color: var(--accent); }
  .method-btn.microsoft .ico { background: rgba(96, 165, 250, 0.15); color: var(--info); }
  .method-btn .body { flex: 1; }
  .method-btn .ttl { font-size: 13px; font-weight: 600; }
  .method-btn .desc { font-size: 11px; color: var(--text-soft); margin-top: 2px; }
  .method-card .input { width: 100%; margin-top: 12px; }
  .method-card .actions { display: flex; gap: 8px; margin-top: 14px; }
  .method-card .actions .btn-primary { flex: 1; }
  .method-card .actions .btn-secondary { flex: 0 0 auto; }
  .method-card .back-btn {
    background: transparent; border: none; color: var(--text-soft);
    cursor: pointer; font-family: inherit; font-size: 11.5px;
    margin-top: 12px; padding: 6px;
  }
  .method-card .back-btn:hover { color: var(--text); }

  /* ===== DEVICE CODE MODAL ===== */
  .modal-back {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px); z-index: 600;
    display: grid; place-items: center;
    animation: fade-in 0.2s;
  }
  .modal {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; max-width: 460px; width: 92%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .modal h2 { font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .modal p { color: var(--text-soft); font-size: 12.5px; margin-bottom: 10px; line-height: 1.5; }
  .device-code {
    font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700;
    letter-spacing: 4px; text-align: center; padding: 16px;
    background: var(--bg-soft); border: 2px dashed var(--primary);
    border-radius: 10px; color: var(--primary); margin: 10px 0;
    user-select: all;
  }
  .device-url {
    text-align: center; color: var(--info);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    padding: 6px; background: var(--bg-soft); border-radius: 6px;
    margin-bottom: 12px; user-select: all;
  }
  .device-steps { background: var(--bg-soft); border-radius: 8px; padding: 12px; font-size: 11.5px; }
  .device-steps ol { margin-left: 18px; }
  .device-steps li { margin-bottom: 4px; color: var(--text-soft); }
  .device-steps li strong { color: var(--text); }
  .modal-actions { display: flex; gap: 6px; margin-top: 14px; }

  /* ===== LOGIN SCREEN (token) ===== */
  .login-back {
    position: fixed; inset: 0; z-index: 400;
    background: var(--bg);
    background-image:
      radial-gradient(at 30% 30%, rgba(94, 234, 212, 0.08) 0px, transparent 50%),
      radial-gradient(at 70% 70%, rgba(251, 191, 36, 0.06) 0px, transparent 50%);
    display: grid; place-items: center;
  }
  .login-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; max-width: 380px; width: 92%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .login-card h1 { font-size: 22px; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .login-card h1 .mark {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), #2dd4bf);
    display: grid; place-items: center; color: #0f1419; font-weight: 700;
  }
  .login-card .sub { color: var(--text-soft); font-size: 12.5px; margin-bottom: 20px; }
  .login-card label { display: block; font-size: 10.5px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .login-card .input { width: 100%; padding: 10px 12px; margin-bottom: 14px; }
  .login-card .btn-primary { width: 100%; padding: 10px; font-size: 13px; }
  .login-card .err { color: var(--danger); font-size: 12px; margin-top: 8px; }
  .login-card .hint { color: var(--text-dim); font-size: 11px; margin-top: 12px; line-height: 1.5; }
  .login-card .hint code { background: var(--bg-soft); padding: 1px 5px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat-card { background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px; }
  .stat-card .num { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; }
  .stat-card .num.green { color: var(--success); }
  .stat-card .num.primary { color: var(--primary); }
  .stat-card .num.purple { color: var(--purple); }
  .stat-card .lbl { font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-top: 2px; }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen" class="login-back">
  <div class="login-card">
    <h1><span class="mark">M</span>MCC 控制台</h1>
    <p class="sub">Minecraft Console Client · 多账号管理</p>
    <label>面板 Token</label>
    <input class="input" id="login-token" placeholder="服务器上: cat /opt/mcc-panel/config/token.txt" />
    <button class="btn-primary" onclick="doLogin()">登录</button>
    <div class="err" id="login-err"></div>
    <div class="hint">
      Token 存在服务器 <code>config/token.txt</code>。
    </div>
  </div>
</div>

<!-- ===== TOP BAR ===== -->
<header class="topbar" id="topbar" style="display:none;">
  <div class="brand">
    <div class="brand-mark">M</div>
    <div class="brand-text">
      <h1>MCC 控制台</h1>
      <p>Multi-Account · v5</p>
    </div>
  </div>
  <div class="topbar-status">
    <div class="status-pill">
      <span class="status-dot" id="dot-active"></span>
      <span id="status-active">未选择</span>
    </div>
    <div class="status-pill">
      <span class="status-dot" id="dot-ws"></span>
      <span id="status-ws">未连接</span>
    </div>
  </div>
</header>

<div class="app" id="app" style="display:none;">

  <!-- LEFT -->
  <div class="col col-left">
    <div class="card">
      <div class="card-head">
        <h3><span class="accent-dot"></span>账号</h3>
        <button class="btn-ghost" onclick="createAccount()">+ 新增</button>
      </div>
      <div class="card-body" style="padding:8px;">
        <div class="acc-list" id="acc-list"></div>
        <div style="display:flex;gap:5px;margin-top:8px;">
          <button class="btn-primary" style="flex:1;font-size:11px;padding:6px;" onclick="startAll()">全部启动</button>
          <button class="btn-secondary" style="font-size:11px;padding:6px;" onclick="stopAll()">全部停止</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3><span class="accent-dot"></span>白名单（自动同意传送）</h3>
      </div>
      <div class="card-body" style="padding:10px;">
        <div class="wl-list" id="wl-list">
          <div class="wl-empty">添加玩家后，他们的 /tpa /tphere 会自动同意</div>
        </div>
        <div class="command-row" style="margin-top:0;">
          <input class="input" id="wl-input" placeholder="玩家名（回车）" />
          <button class="btn-secondary" onclick="addWhitelist()">添加</button>
        </div>
        <div style="font-size:10px;color:var(--text-dim);margin-top:6px;line-height:1.5;">
          ✦ 白名单内玩家的 <code>/tpa</code> / <code>/tphere</code> → 自动 <code>/tpaccept</code>
        </div>
      </div>
    </div>
  </div>

  <!-- MIDDLE -->
  <div class="col">
    <div class="card">
      <div class="card-head">
        <h3>
          <span class="accent-dot"></span>
          <span id="active-title">未选择账号</span>
        </h3>
        <div style="display:flex;gap:5px;">
          <button class="btn-ghost" id="btn-start" onclick="openLoginMethodPicker()" disabled>▶ 启动</button>
          <button class="btn-ghost" id="btn-stop" onclick="stopActive()" disabled>■ 停止</button>
        </div>
      </div>
      <div class="card-body" style="padding:12px;">
        <div style="font-size:10px;color:var(--text-dim);margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap;">
          <span><span style="color:var(--info);">■</span> MCC 内部</span>
          <span><span style="color:var(--primary);">■</span> 服务器</span>
          <span><span style="color:var(--accent);">■</span> 聊天</span>
          <span><span style="color:var(--success);">■</span> 传送</span>
        </div>

        <div class="actions-grid" id="action-grid">
          <button class="action-btn cmd-internal" data-cmd="/help" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span class="lbl">帮助</span><span class="hint">/help</span>
          </button>
          <button class="action-btn cmd-internal" data-cmd="/list" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            <span class="lbl">玩家列表</span><span class="hint">/list</span>
          </button>
          <button class="action-btn cmd-internal" data-cmd="/reconnect" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            <span class="lbl">重连</span><span class="hint">/reconnect</span>
          </button>
          <button class="action-btn cmd-internal" data-cmd="/respawn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span class="lbl">重生</span><span class="hint">/respawn</span>
          </button>

            <span class="lbl">设置家</span><span class="hint">/sethome</span>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14l-4-4 4-4"/><path d="M5 10h11a4 4 0 0 1 0 8h-4"/></svg>

          <button class="action-btn cmd-tp" data-tp-accept="tpa" disabled>

            <span class="lbl">同意 TPA</span><span class="hint">/tpaccept</span>
          </button>
          <button class="action-btn cmd-tp" data-tp-accept="tphere" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            <span class="lbl">同意 TPHERE</span><span class="hint">/tpaccept</span>
          </button>

          <button class="action-btn cmd-chat" data-chat-msg="hi 大家好，我是机器人 🤖" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span class="lbl">发打招呼</span><span class="hint">chat</span>
          </button>

          <button class="action-btn cmd-danger" data-cmd="/disconnect" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
            <span class="lbl">断开</span><span class="hint">/disconnect</span>
          </button>
          <button class="action-btn cmd-danger" data-cmd="/quit" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            <span class="lbl">退出</span><span class="hint">/quit</span>

        <div class="command-row">
          <input class="input" id="customCmd" placeholder="自定义命令：/开头 MCC 命令，/开头也是服务器命令，无 / 是聊天" disabled />
          <button class="btn-primary" id="btn-send-cmd" onclick="sendCustom()" disabled>发送</button>
        </div>

    <div class="card" style="flex:1;">
      <div class="card-head">
        <h3><span class="accent-dot"></span>实时输出 <span style="font-size:10px;color:var(--text-dim);text-transform:none;margin-left:6px;">— 当前账号</span></h3>
        <div style="display:flex;gap:5px;">
          <button class="btn-ghost" onclick="clearLogs()">清屏</button>
          <button class="btn-ghost" onclick="toggleAutoScroll()" id="btn-autoscroll">滚动 ON</button>
        </div>
      </div>
      <div class="console" id="console"></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="col col-right">
    <div class="card">
      <div class="card-head"><h3><span class="accent-dot"></span>服务器</h3></div>
      <div class="card-body">
        <div class="form-row"><label>昵称</label><input class="input" id="cfg-name" placeholder="主号" /></div>
        <div class="form-row"><label>服务器 IP</label><input class="input" id="cfg-host" placeholder="mc.example.com" /></div>
        <div class="form-row"><label>端口</label><input class="input" id="cfg-port" value="25565" /></div>
        <div class="form-row"><label>版本（留空自动）</label><input class="input" id="cfg-version" placeholder="1.20.4" /></div>
        <button class="btn-secondary" style="width:100%;margin-top:6px;" onclick="saveCurrent()">保存</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3><span class="accent-dot"></span>机器人</h3></div>
      <div class="card-body">
        <div class="form-row">
          <label class="check"><input type="checkbox" id="bot-autoreconnect" checked /> 断线自动重连</label>
          <label class="check"><input type="checkbox" id="bot-antiafk" checked /> 防 AFK</label>
          <label class="check"><input type="checkbox" id="bot-logchat" checked /> 记录聊天</label>
          <label class="check"><input type="checkbox" id="bot-autotp" checked /> 白名单自动 /tpaccept</label>
        </div>
        <button class="btn-secondary" style="width:100%;margin-top:6px;" onclick="saveCurrent()">保存</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3><span class="accent-dot"></span>状态</h3></div>
      <div class="card-body">
        <div class="stat-grid">
          <div class="stat-card">
            <div class="num primary" id="stat-msgs">0</div>
            <div class="lbl">收到消息</div>
          </div>
          <div class="stat-card">
            <div class="num purple" id="stat-cmds">0</div>
            <div class="lbl">发出命令</div>
          </div>
          <div class="stat-card">
            <div class="num green" id="stat-tp">0</div>
            <div class="lbl">自动同意传送</div>
          </div>
          <div class="stat-card">
            <div class="num" id="stat-uptime" style="color:var(--text-soft);font-size:13px;">--:--</div>
            <div class="lbl">运行时长</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<div id="modal-root"></div>

<script>
// ============================================================
// STATE
// ============================================================
const state = {
  token: null,
  accounts: [],
  active: null,
  whitelist: [],
  autoScroll: true,
  msgs: 0, cmds: 0, tp: 0, uptime: 0,
  uptimeTimer: null,
  ws: null,
  reconnectAttempt: 0,
  pendingLogin: null  // account awaiting login method
};

const consoleEl = document.getElementById('console');

// ============================================================
// LOGGING
// ============================================================
function log(tag, msg) {
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `<span class="log-time">${time}</span><span class="log-tag ${tag}">${tag.toUpperCase()}</span><span class="log-msg">${formatMsg(msg)}</span>`;
  consoleEl.appendChild(line);
  if (state.autoScroll) consoleEl.scrollTop = consoleEl.scrollHeight;
  if (consoleEl.children.length > 2000) consoleEl.removeChild(consoleEl.firstChild);
  if (tag === 'chat') { state.msgs++; document.getElementById('stat-msgs').textContent = state.msgs; }
  if (tag === 'cmd')  { state.cmds++; document.getElementById('stat-cmds').textContent = state.cmds; }
  if (tag === 'tp')   { state.tp++; document.getElementById('stat-tp').textContent = state.tp; }
}
function formatMsg(text) {
  return String(text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/<(\w+)>/g, '<span class="mention">$1</span>')
    .replace(/\[(\w+)\]/g, '<span class="player">$1</span>');
}
function clearLogs() {
  consoleEl.innerHTML = '';
  state.msgs = 0; state.cmds = 0; state.tp = 0;
  document.getElementById('stat-msgs').textContent = 0;
  document.getElementById('stat-cmds').textContent = 0;
  document.getElementById('stat-tp').textContent = 0;
}
function toggleAutoScroll() {
  state.autoScroll = !state.autoScroll;
  document.getElementById('btn-autoscroll').textContent = state.autoScroll ? '滚动 ON' : '滚动 OFF';
}
function toast(msg, type='info', duration=3000) {
  const t = document.createElement('div');
  t.className = 'toast' + (type !== 'info' ? ' ' + type : '');
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(20px)'; setTimeout(()=>t.remove(), 200); }, duration);
}
function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================================================
// WEBSOCKET
// ============================================================
function connectWS(token) {
  if (state.ws) { try { state.ws.close(); } catch {} state.ws = null; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`;
  log('system', '→ 连接后端...');
  const ws = new WebSocket(url);
  state.ws = ws;
  ws.onopen = () => {
    state.reconnectAttempt = 0;
    log('system', '✓ 已连接后端');
    document.getElementById('dot-ws').className = 'status-dot online';
    document.getElementById('status-ws').textContent = '已连接';
  };
  ws.onclose = () => {
    document.getElementById('dot-ws').className = 'status-dot offline';
    document.getElementById('status-ws').textContent = '未连接';
    log('error', '✗ 与后端断开');
    if (state.token) {
      state.reconnectAttempt++;
      const delay = Math.min(2000 + state.reconnectAttempt * 1000, 10000);
      log('system', `${delay/1000}秒后重连...`);
      setTimeout(() => connectWS(state.token), delay);
    }
  };
  ws.onerror = () => log('error', 'WebSocket 错误');
  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    handleBackendMsg(msg);
  };
}
function sendWS(obj) {
  if (!state.ws || state.ws.readyState !== 1) { toast('未连接到后端', 'warn'); return false; }
  state.ws.send(JSON.stringify(obj));
  return true;
}

function handleBackendMsg(msg) {
  switch (msg.type) {
    case 'hello':
      state.accounts = msg.accounts || [];
      state.whitelist = msg.whitelist || [];
      renderAccounts();
      renderWhitelist();
      if (!state.active && state.accounts.length > 0) selectAccount(state.accounts[0].id);
      log('system', `✓ 后端就绪 · ${state.accounts.length} 账号 · 白名单 ${state.whitelist.length} 人`);
      break;
    case 'accounts':
      state.accounts = msg.accounts || [];
      renderAccounts();
      if (state.active && !state.accounts.find(a => a.id === state.active)) {
        state.active = state.accounts[0]?.id || null;
        if (state.active) selectAccount(state.active);
      }
      break;
    case 'output':
      if (msg.accountId === state.active) routeOutput(msg.data);
      updateAccountStatusFromOutput(msg.accountId, msg.data);
      break;
    case 'device-code':
      showDeviceCode(msg.accountId, msg.code, msg.url);
      break;
    case 'account-status': {
      const a = state.accounts.find(x => x.id === msg.id);
      if (a) { a.status = msg.status; renderAccounts(); updateActionStates(); updateTopStatus(); }
      break;
    }
    case 'whitelist-update':
      state.whitelist = msg.whitelist || [];
      renderWhitelist();
      break;
    case 'tp-auto':
      if (msg.accountId === state.active) log('tp', `🤖 白名单 ${msg.player} → 自动 /tpaccept (${msg.kind.toUpperCase()})`);
      break;
    case 'error':
      log('error', msg.msg);
      toast(msg.msg, 'error');
      break;
  }
}

function routeOutput(raw) {
  const lines = raw.split(/[\r\n]+/).filter(l => l.trim());
  for (const line of lines) {
    const l = line.trim();
    if (!l) continue;
    if (/has requested to teleport to you|wants to teleport to you/i.test(l)) log('tp', '📩 ' + l);
    else if (/has requested that you teleport|requested you to teleport/i.test(l)) log('tp', '📩 ' + l);
    else if (/accepted your teleport request/i.test(l)) log('tp', '✅ ' + l);
    else if (/^\[\d+:\d+:\d+\] \[CHAT\]/.test(l) || (l.startsWith('<') && l.includes('>'))) {
      log('chat', l.replace(/^\[\d+:\d+:\d+\] \[CHAT\]\s*/i, ''));
    } else if (l.startsWith('>')) {
      // command echo, skip
    } else if (/error|fail|exception|cannot/i.test(l)) log('error', l);
    else if (/warn|注意/i.test(l)) log('warn', l);
    else log('info', l);
  }
}

function updateAccountStatusFromOutput(accountId, data) {
  const a = state.accounts.find(x => x.id === accountId);
  if (!a) return;
  if (/Logged in|session.+started|joined the game/i.test(data)) {
    if (a.status !== 'online') { a.status = 'online'; renderAccounts(); updateActionStates(); updateTopStatus(); }
  } else if (/Disconnect|Connection lost|kicked|Disconnected/i.test(data) && a.status === 'online') {
    a.status = 'connecting';
    renderAccounts(); updateActionStates(); updateTopStatus();
  } else if (/https:\/\/microsoft.com\/link|device code|To sign in/i.test(data)) {
    a.status = 'waiting';
    renderAccounts(); updateActionStates(); updateTopStatus();
  } else if (/Unable to authenticate|Authentication failed|Invalid credentials/i.test(data)) {
    a.status = 'error';
    renderAccounts(); updateActionStates(); updateTopStatus();
  }
}

// ============================================================
// ACCOUNTS
// ============================================================
function renderAccounts() {
  const el = document.getElementById('acc-list');
  if (state.accounts.length === 0) {
    el.innerHTML = '<div style="color:var(--text-dim);font-size:10.5px;padding:8px;text-align:center;">还没有账号，点「+ 新增」</div>';
    return;
  }
  el.innerHTML = state.accounts.map(a => `
    <div class="acc-item ${state.active === a.id ? 'active' : ''}" data-id="${a.id}">
      <div class="acc-status-dot ${a.status}"></div>
      <div class="acc-info">
        <div class="acc-name">${escapeHtml(a.name || '未命名')}</div>
        <div class="acc-meta">${escapeHtml(a.user || '未配置')} · ${a.status}</div>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.acc-item').forEach(item => {
    item.addEventListener('click', () => selectAccount(item.dataset.id));
  });
}

function selectAccount(id) {
  if (state.active === id) return;
  state.active = id;
  state.msgs = 0; state.cmds = 0; state.tp = 0; state.uptime = 0;
  document.getElementById('stat-msgs').textContent = 0;
  document.getElementById('stat-cmds').textContent = 0;
  document.getElementById('stat-tp').textContent = 0;
  document.getElementById('stat-uptime').textContent = '--:--';
  if (state.uptimeTimer) clearInterval(state.uptimeTimer);

  const a = state.accounts.find(x => x.id === id);
  if (a) {
    document.getElementById('active-title').textContent = a.name + ' › ' + (a.user || '未配置');
    document.getElementById('cfg-name').value = a.name || '';
    document.getElementById('cfg-host').value = a.host || '';
    document.getElementById('cfg-port').value = a.port || '25565';
    document.getElementById('cfg-version').value = a.version || '';
    document.getElementById('bot-autoreconnect').checked = a.bots?.autoreconnect !== false;
    document.getElementById('bot-antiafk').checked = a.bots?.antiafk !== false;
    document.getElementById('bot-logchat').checked = a.bots?.logchat !== false;
    document.getElementById('bot-autotp').checked = a.bots?.autotp !== false;
    clearLogs();
    log('system', `已切换到账号: ${a.name}`);
    if (a.status === 'online') log('info', '账号在线中...');
  }
  renderAccounts();
  updateActionStates();
  updateTopStatus();
  startUptimeTimer();
}

function updateActionStates() {
  const a = state.accounts.find(x => x.id === state.active);
  const online = a && a.status === 'online';
  document.querySelectorAll('.action-btn').forEach(b => b.disabled = !online);
  document.getElementById('customCmd').disabled = !online;
  document.getElementById('btn-send-cmd').disabled = !online;
  document.getElementById('btn-start').disabled = !a || ['online','connecting','waiting'].includes(a.status);
  document.getElementById('btn-stop').disabled = !a || a.status === 'offline';
}

function updateTopStatus() {
  const a = state.accounts.find(x => x.id === state.active);
  const dot = document.getElementById('dot-active');
  const txt = document.getElementById('status-active');
  if (!a) { dot.className = 'status-dot'; txt.textContent = '未选择'; return; }
  dot.className = 'status-dot ' + a.status;
  const map = { 'offline': '离线', 'connecting': '连接中', 'online': '在线 ✓', 'error': '错误', 'waiting': '等待登录' };
  txt.textContent = `${a.name} · ${map[a.status] || a.status}`;
}

function createAccount() {
  if (!state.active) {
    sendWS({ type: 'create-account' });
    return;
  }
  sendWS({ type: 'create-account' });
}

function startActive() {
  // Now opens login method picker instead of starting directly
  openLoginMethodPicker();
}

function stopActive() {
  const a = state.accounts.find(x => x.id === state.active);
  if (!a) return;
  sendWS({ type: 'stop-account', id: a.id });
}

function startAll() {
  // Start all in default offline mode (fastest, no device code popup)
  sendWS({ type: 'start-all', method: 'offline' });
}

function stopAll() { sendWS({ type: 'stop-all' }); }

function saveCurrent() {
  const a = state.accounts.find(x => x.id === state.active);
  if (!a) { toast('先选一个账号', 'warn'); return; }
  a.name = document.getElementById('cfg-name').value || a.name;
  a.host = document.getElementById('cfg-host').value;
  a.port = document.getElementById('cfg-port').value;
  a.version = document.getElementById('cfg-version').value;
  a.bots = {
    autoreconnect: document.getElementById('bot-autoreconnect').checked,
    antiafk: document.getElementById('bot-antiafk').checked,
    logchat: document.getElementById('bot-logchat').checked,
    autotp: document.getElementById('bot-autotp').checked,
  };
  sendWS({ type: 'update-account', account: a });
  document.getElementById('active-title').textContent = a.name + ' › ' + (a.user || '未配置');
  renderAccounts();
  log('system', '已保存');
  toast('已保存');
}

function startUptimeTimer() {
  if (state.uptimeTimer) clearInterval(state.uptimeTimer);
  state.uptimeTimer = setInterval(() => {
    const a = state.accounts.find(x => x.id === state.active);
    if (a && a.status === 'online') {
      state.uptime++;
      const h = String(Math.floor(state.uptime / 3600)).padStart(2, '0');
      const m = String(Math.floor((state.uptime % 3600) / 60)).padStart(2, '0');
      const s = String(state.uptime % 60).padStart(2, '0');
      document.getElementById('stat-uptime').textContent = `${h}:${m}:${s}`;
    }
  }, 1000);
}

// ============================================================
// LOGIN METHOD PICKER (v5 NEW)
// ============================================================
function openLoginMethodPicker() {
  const a = state.accounts.find(x => x.id === state.active);
  if (!a) { toast('请先选择一个账号', 'warn'); return; }
  if (!a.host) { toast('请先在右侧填服务器 IP', 'warn'); return; }

  state.pendingLogin = a;
  showMethodPicker();
}

function showMethodPicker() {
  // Pick which method - first screen
  const root = document.getElementById('modal-root');
  const a = state.pendingLogin;
  root.innerHTML = `
    <div class="method-picker" onclick="if(event.target===this) closeMethodPicker()">
      <div class="method-card">
        <h2>👤 ${escapeHtml(a.name)} · 选择登录方式</h2>
        <div class="sub">服务器：<code>${escapeHtml(a.host || '')}:${escapeHtml(a.port || '')}</code></div>
        <div class="method-buttons">
          <button class="method-btn offline" onclick="showOfflineForm()">
            <div class="ico">⚡</div>
            <div class="body">
              <div class="ttl">离线模式登录</div>
              <div class="desc">输入任意玩家名，无需密码</div>
            </div>
          </button>
          <button class="method-btn microsoft" onclick="startMicrosoftLogin()">
            <div class="ico">🔵</div>
            <div class="body">
              <div class="ttl">微软账号登录</div>
              <div class="desc">MCC 弹出 microsoft.com/link，输入代码授权</div>
            </div>
          </button>
        </div>
        <button class="back-btn" onclick="closeMethodPicker()">取消</button>
      </div>
    </div>
  `;
}

function showOfflineForm() {
  const a = state.pendingLogin;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="method-picker" onclick="if(event.target===this) closeMethodPicker()">
      <div class="method-card">
        <h2>⚡ 离线模式登录</h2>
        <div class="sub">${escapeHtml(a.name)} → ${escapeHtml(a.host || '')}:${escapeHtml(a.port || '')}</div>
        <label style="font-size:10.5px;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-top:8px;">玩家名</label>
        <input class="input" id="offline-name" placeholder="输入玩家名" value="${escapeHtml(a.user || '')}" autocomplete="off" />
        <div style="font-size:11px;color:var(--text-dim);margin-top:8px;line-height:1.5;">
          ⚠ 离线模式服务器可能拒绝（如果该服务器要求正版验证）
        </div>
        <div class="actions">
          <button class="btn-primary" onclick="confirmOffline()">启动 MCC</button>
          <button class="btn-secondary" onclick="showMethodPicker()">返回</button>
        </div>
      </div>
    </div>
  `;
  setTimeout(() => document.getElementById('offline-name').focus(), 50);
}

function confirmOffline() {
  const name = document.getElementById('offline-name').value.trim();
  if (!name) { toast('请输入玩家名', 'warn'); return; }
  const a = state.pendingLogin;
  // Save the username to the account
  a.user = name;
  a.auth = 'offline';
  sendWS({ type: 'update-account', account: a });
  // Now start MCC
  a.status = 'connecting';
  renderAccounts(); updateActionStates(); updateTopStatus();
  sendWS({ type: 'start-account', id: a.id });
  closeMethodPicker();
  log('system', `→ 启动 MCC (离线): ${name}`);
}

function startMicrosoftLogin() {
  const a = state.pendingLogin;
  if (!a.user) { toast('请先在右侧填邮箱/玩家名', 'warn'); closeMethodPicker(); return; }
  // Set auth to microsoft and start
  a.auth = 'microsoft';
  sendWS({ type: 'update-account', account: a });
  a.status = 'connecting';
  renderAccounts(); updateActionStates(); updateTopStatus();
  sendWS({ type: 'start-account', id: a.id });
  closeMethodPicker();
  log('system', '→ 启动 MCC (微软) · 等待设备码...');
  toast('MCC 正在拉取设备码', 'info', 4000);
}

function closeMethodPicker() {
  document.getElementById('modal-root').innerHTML = '';
  state.pendingLogin = null;
}

// ============================================================
// COMMANDS
// ============================================================
function sendCmd(text) {
  if (!text || !text.trim()) return;
  const a = state.accounts.find(x => x.id === state.active);
  if (!a) { toast('没选账号', 'warn'); return; }
  if (a.status !== 'online') { toast('账号未连接', 'warn'); return; }
  log('cmd', '> ' + text);
  sendWS({ type: 'cmd', accountId: a.id, text });
}
function sendCustom() {
  const v = document.getElementById('customCmd').value.trim();
  if (!v) return;
  sendCmd(v);
  document.getElementById('customCmd').value = '';
}
document.getElementById('customCmd').addEventListener('keydown', e => { if (e.key === 'Enter') sendCustom(); });

document.querySelectorAll('.action-btn').forEach(b => {
  b.addEventListener('click', () => {
    const cmd = b.dataset.cmd;
    const chatMsg = b.dataset.chatMsg;
    const tpAccept = b.dataset.tpAccept;
    if (cmd) sendCmd(cmd);
    if (chatMsg) sendCmd(chatMsg);
    if (tpAccept) sendCmd('/tpaccept');
  });
});

// ============================================================
// WHITELIST
// ============================================================
function renderWhitelist() {
  const el = document.getElementById('wl-list');
  if (state.whitelist.length === 0) {
    el.innerHTML = '<div class="wl-empty">添加玩家后，他们的 /tpa /tphere 会自动同意</div>';
    return;
  }
  el.innerHTML = state.whitelist.map(p =>
    `<span class="wl-chip">${escapeHtml(p)}<button class="x" onclick="removeWhitelist('${escapeHtml(p)}')">×</button></span>`
  ).join('');
}
function addWhitelist() {
  const v = document.getElementById('wl-input').value.trim();
  if (!v) return;
  if (state.whitelist.includes(v)) { toast('已在白名单', 'warn'); return; }
  state.whitelist.push(v);
  sendWS({ type: 'whitelist-set', whitelist: state.whitelist });
  document.getElementById('wl-input').value = '';
  toast(`已加 ${v}`);
}
function removeWhitelist(p) {
  state.whitelist = state.whitelist.filter(x => x !== p);
  sendWS({ type: 'whitelist-set', whitelist: state.whitelist });
  toast(`已移除 ${p}`);
}
document.getElementById('wl-input').addEventListener('keydown', e => { if (e.key === 'Enter') addWhitelist(); });

// ============================================================
// DEVICE CODE MODAL
// ============================================================
function showDeviceCode(accountId, code, url) {
  const a = state.accounts.find(x => x.id === accountId);
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-back" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>🔐 微软账号登录</h2>
        <p>账号 <strong style="color:var(--primary);">${escapeHtml(a?.name || '')}</strong> · 浏览器打开下面的链接，输入代码授权：</p>
        <div class="device-code">${escapeHtml(code)}</div>
        <div class="device-url">👉 ${escapeHtml(url || 'https://microsoft.com/link')}</div>
        <div class="device-steps">
          <ol>
            <li>用电脑/手机浏览器<strong>打开上面网址</strong></li>
            <li>登录<strong>购买 Minecraft 的微软账号</strong></li>
            <li>输入代码 <strong>${escapeHtml(code)}</strong></li>
            <li>点<strong>「允许」</strong></li>
            <li>登录完成自动继续</li>
          </ol>
        </div>
        <div class="modal-actions">
          <button class="btn-primary" style="flex:1;" onclick="copyText('${escapeHtml(code)}')">复制代码</button>
          <button class="btn-secondary" onclick="copyText('${escapeHtml(url || 'https://microsoft.com/link')}')">复制网址</button>
          <button class="btn-secondary" onclick="closeModal()">关闭</button>
        </div>
      </div>
    </div>
  `;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
function copyText(t) { navigator.clipboard.writeText(t).then(() => toast('已复制: ' + t)); }

// ============================================================
// LOGIN
// ============================================================
function doLogin() {
  const t = document.getElementById('login-token').value.trim();
  if (!t) { document.getElementById('login-err').textContent = '请输入 Token'; return; }
  state.token = t;
  localStorage.setItem('mcc-token', t);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('app').style.display = 'grid';
  connectWS(t);
  fetch('/api/status').then(r => r.json()).then(data => {
    if (data.accounts) {
      state.accounts = data.accounts;
      state.whitelist = data.whitelist || [];
      renderAccounts();
      renderWhitelist();
      if (!state.active && state.accounts.length > 0) selectAccount(state.accounts[0].id);
    }
  }).catch(() => {});
}
document.getElementById('login-token').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ============================================================
// INIT
// ============================================================
const savedToken = localStorage.getItem('mcc-token');
if (savedToken) document.getElementById('login-token').value = savedToken;
log('system', 'MCC 控制台 v5 已加载');
</script>
</body>
</html>
